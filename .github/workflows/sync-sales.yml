# .github/workflows/sync-sales.yml

name: 📈 Sync Event Sales Data

on:
  # DISABLED 2026-08-21: sync-sales.js wrote to events_sales, which was
  # dropped in migration 001 (aggregates now come from SQL over order_items).
  # Manual trigger kept for reference only — do not run.
  workflow_dispatch:

jobs:
  sync-sales:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Check out repository code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install dependencies
        run: npm install @supabase/supabase-js dotenv

      - name: 🚀 Run the sales sync script
        run: node sync-sales.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
